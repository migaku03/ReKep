device: &device 'cuda'
seed: &seed 0

main:
  interpolate_pos_step_size: &interpolate_pos_step_size 0.05  # controls the density of the final returned path
  interpolate_rot_step_size: &interpolate_rot_step_size 0.34  # about 20 degrees
  grasp_depth: 0.10
  # Which local axis of the eef frame the grasp advances along, and how far back the pregrasp
  # standoff sits as a fraction of grasp_depth. 'x' / 0.5 is upstream ReKep, bit for bit.
  #
  # These two are coupled and must be read together. Upstream backs off grasp_depth/2 and then
  # advances grasp_depth, so the gripper ends grasp_depth/2 past the pose the solver returned.
  # Along local X that overshoot runs along the pen's long axis and is harmless. Along local Z --
  # the actual approach axis, which subgoal_solver.py:71 already optimises for -- it drives the
  # gripper grasp_depth/2 into the tabletop. Measured: localZ->world = [-0.021, 0.168, -0.986]
  # (straight down) while localX->world = [0.276, -0.947, -0.167] (nearly horizontal), so the
  # 10 cm advance currently moves the gripper 9.5 cm sideways and only 1.7 cm down.
  #
  # Setting axis to 'z' with ratio 1.0 makes standoff and advance cancel, so the gripper lands
  # exactly on the solved pose while approaching from above.
  grasp_approach_axis: x
  grasp_standoff_ratio: 0.5
  constraint_tolerance: 0.10  # for backtracking
  bounds_min: &bounds_min [-0.45, -0.75, 0.698]
  bounds_max: &bounds_max [0.10, 0.60, 1.2]
  sdf_voxel_size: 0.01
  vlm_camera: 0
  action_steps_per_iter: 5
  seed: *seed
  # Lula descriptor + IK target link for the reachability cost. Named here rather than hardcoded
  # in main.py so a different robot is a different config file, not a code change. The target is
  # wrist_roll_link, not eef_link, because eef_link is a runtime meta-link absent from the URDF
  # lula parses; the gripper-length offset is acceptable for a soft cost. See config_widowxai.yaml.
  ik:
    descriptor: fetch_descriptor.yaml
    eef_name: wrist_roll_link

env:
  video_cache_size: 2000
  og_sim:
    physics_frequency: 100
    rendering_frequency: 20
    action_frequency: 20
    
  scene:
    name: Rs_int
    type: InteractiveTraversableScene
    scene_model: Rs_int

  bounds_min: *bounds_min
  bounds_max: *bounds_max
  interpolate_pos_step_size: *interpolate_pos_step_size
  interpolate_rot_step_size: *interpolate_rot_step_size

  robot:
    robot_config:
      name: Fetch
      type: Fetch
      obs_modalities: [rgb, depth]
      action_modalities: continuous
      action_normalize: False
      position: [-0.8, 0.0, 0.]
      grasping_mode: assisted

      controller_config:
        base:
          name: DifferentialDriveController
        arm_0:
          name: OperationalSpaceController
          # Give the trunk back to the arm controller. In the OmniGibson this demo was written
          # against, Fetch._default_controller_config forced the arm controller's dof_idx to
          # concat(trunk_control_idx, arm_control_idx), so the OSC solved for 8 joints. The
          # trunk has since been split out into its own JointController, leaving the OSC with
          # 7 -- while configs/fetch_descriptor.yaml still declares an 8-joint cspace, so the
          # subgoal/path solvers keep reporting ik_feasible for poses the executor cannot
          # reach. Measured consequence: on the "lift the pen over the holder" stage the
          # wrist_flex joint pins against its +2.16 rad limit and the eef freezes 12.5 cm
          # short, with the trunk held at 0.38 and zero commanded velocity.
          subsume_controllers: [trunk]
          kp: 250
          kp_limits: [50, 400]
          damping_ratio: 0.6
          # LEAVE THIS AT 0.0 FOR ANY RUN THAT IS MEANT TO BE "ReKep".
          #
          # lambda_damping is a parameter this project ADDED to OmniGibson's
          # OperationalSpaceController (patches/omnigibson_osc_damped_least_squares.patch), which
          # otherwise computes inv(J M^-1 J^T) with no regularisation whatsoever. That is verified
          # identical in cc0316a05, the commit upstream ReKep was written against -- so upstream
          # ReKep ran undamped, and a damped run is not a run of ReKep. It belongs in its own row
          # next to vlm_query/pen_upright_fixed, not folded into the baseline. See chapter 18.
          #
          # What it was for: at elbow_flex = 0 Fetch's upperarm_roll and forearm_roll axes are both
          # (1,0,0) with only x-offsets between them, so they lie on the same line and the Jacobian
          # loses exactly one rank (measured fix4: elbow_flex = 0.0006, sigma_min = 8.0e-05,
          # cond = 22332, at 0.567 m of a ~0.97 m reach -- an INTERIOR singularity, so moving the
          # robot or the table does not avoid it).
          #
          # What the one damped run actually showed (damp1, SUCCESS, best miss so far at 2.66 cm):
          # the stall became a complete standstill instead of a wrong-direction drift, but
          # elbow_flex stayed at 0.0119 and wrist_flex pinned harder (margin 0.0000 vs 0.0023).
          # So the wrist pinning is configuration-driven, not control-driven. Damping did not fix
          # it and was never going to.
          #
          # And the reason this is not the priority: condition number does not predict outcome.
          # run7 FAILED at cond 8.8 and 10.4; fix4 SUCCEEDED at cond 22332. What separates the
          # runs is torso_lift_joint hitting its 0.3862 stop (failures 2/2, stalling successes
          # 0/3). Chase that, not the singularity.
          #
          # If you do turn it on: 0.032 means lambda^2 = 1e-3, which moves the healthy eigenvalues
          # of J M^-1 J^T (O(0.09-2.0)) by <1.2% while taking the degenerate one from 3.6e-09 to
          # 1.0e-03. Results are flat over lambda in [0.01, 0.1], so it is not a tuned number.
          lambda_damping: 0.0
          # kp_null is left at the OSC default of 10. Raising it to 40 was tried while chasing
          # the trunk pinning at its 0.3862 stop: it did pull the arm back toward the holder
          # instead of away from it, but it simply moved the pinning to the other end (trunk at
          # 0.0000 seven times, wrist_roll wound to -6.2832), so it is not a fix on its own. It
          # belongs with a wider retune of the execution layer, not on its own.
        gripper_0:
          name: MultiFingerGripperController
          command_input_limits: [0.0, 1.0]
          mode: smooth
        camera:
          name: JointController

  camera:
    # recorder 
    1:
      name: cam_1
      position: [ 0.6137,  0.4764,  1.4565]
      orientation: [ 0.3212,  0.4682,  0.6788,  0.4656]
      resolution: 480

    # vlm camera
    0:
      name: cam_0
      position: [-0.1655,  0.0167,  1.3664]
      orientation: [ 0.0550,  0.0544,  0.7010,  0.7090]
      resolution: 480

path_solver:
  opt_pos_step_size: 0.20  # controls the density of control points in the path
  opt_rot_step_size: 0.78  # controls the density of control points in the path
  opt_interpolate_pos_step_size: 0.02  # controls the density of collision checking inside optimization
  opt_interpolate_rot_step_size: 0.10
  max_collision_points: 60
  sampling_maxfun: 5000
  bounds_min: *bounds_min
  bounds_max: *bounds_max
  constraint_tolerance: 0.0001
  minimizer_options:
    maxiter: 200

subgoal_solver:
  bounds_min: *bounds_min
  bounds_max: *bounds_max
  sampling_maxfun: 5000
  max_collision_points: 60
  constraint_tolerance: 0.0001
  minimizer_options:
    maxiter: 200

keypoint_proposer:
  num_candidates_per_mask: 5
  min_dist_bt_keypoints: 0.06
  max_mask_ratio: 0.5
  device: *device
  bounds_min: *bounds_min
  bounds_max: *bounds_max
  seed: *seed

constraint_generator:
  model: chatgpt-4o-latest
  temperature: 0.0
  max_tokens: 2048

visualizer:
  bounds_min: *bounds_min
  bounds_max: *bounds_max