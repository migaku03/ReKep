# ReKep on the Trossen WidowX AI Follower -- the arm this research will use on hardware.
#
#   python main.py --use_cached_query --config ./configs/config_widowxai.yaml
#
# A separate file rather than an edit to config.yaml, so the Fetch setup that every result in
# chapters 1-20 was measured on stays byte-identical and both robots can be run from the same
# checkout. Everything below that is not robot-dependent is copied from config.yaml unchanged;
# the robot block and the `ik` block are the real content. Rationale for the choices is in
# docs/sim_platform_decision.md and assets/widowxai/README.md.
#
# Status: this config is for bring-up. It gets the robot loaded and ReKep running. The task
# layout is still the one authored for Fetch -- a mobile base with a lifting torso -- and has NOT
# been re-designed for a bolted-down 0.7 m arm, so the pen task is not expected to succeed yet.

device: &device 'cuda'
seed: &seed 0

main:
  interpolate_pos_step_size: &interpolate_pos_step_size 0.05
  interpolate_rot_step_size: &interpolate_rot_step_size 0.34  # about 20 degrees
  grasp_depth: 0.10

  # Unlike Fetch, this robot's approach axis lands on the eef frame's z column, because the
  # imported eef_link is built to OmniGibson's convention (z out of the fingertips) rather than
  # inherited from the URDF's x-forward ee_gripper_link. 'z' with ratio 1.0 makes the pregrasp
  # standoff and the grasp advance cancel, so the gripper lands exactly on the pose the solver
  # returned while approaching from above -- which is the behaviour chapter 11 wanted and could
  # not have on Fetch.
  #
  # Measured on the loaded robot, not assumed from the URDF/import config (tools/check_widowxai.py):
  # column 2 points out of the fingertips (dot with the link_6->fingertip-midpoint direction =
  # 0.99) and column 1 is exactly the finger-separation axis (dot = 1.00). See
  # docs/widowxai_bringup_status.md.
  grasp_approach_axis: z
  grasp_standoff_ratio: 1.0

  constraint_tolerance: 0.10  # for backtracking
  # Workspace box. x/y still the Fetch numbers; re-deriving those for a fixed base whose
  # kinematic reach is 0.833 m is separate task-layout work, not done yet.
  #
  # bounds_min z WAS also the Fetch number (0.698, table-top height) and was found to be the
  # direct cause of the grasp missing the pen: environment.py's workspace-bounds clip
  # (execute_action, "Target position is out of bounds, clipping to workspace bounds") fired on
  # every grasp attempt, so the eef tip never descended past 0.698. _execute_grasp_action's
  # advance is deliberately aimed a few cm past the raw solved pose ("through the object"), and
  # for Fetch that overshoot happened to still land the grasp zone right; for this robot it did
  # not, for a geometric reason specific to it: WidowX AI's eef tip sits almost exactly at the
  # fingertip (measured finger_max_z ~ 0.0004, docs/widowxai_bringup_status.md), but the region
  # BETWEEN the open jaws -- where an object actually needs to be for the fingers to close around
  # it -- sits ~3cm further back toward the wrist (measured directly, tools/check_grasp_depth.py:
  # the four hand-authored AG points average z_local = -0.0319 m in the eef frame, i.e. behind
  # the tip). Given the eef's near-vertical approach (~99% along -world z), that ~3cm offset
  # translates to the jaws closing ~3cm ABOVE wherever the tip stopped -- with the tip clipped at
  # table height, the jaws closed roughly 1.2cm above the pen's own top surface (pen AABB z max
  # 0.7172 vs clipped tip 0.698 + ~0.0316 offset =~ 0.7296), i.e. exactly "grasping above the
  # pen." The logged unclipped targets ran 0.6706-0.6924 across several attempts; 0.665 sits
  # below all of them with a small margin, without going meaningfully deeper than what the
  # existing "aim through the object" design already relies on.
  bounds_min: &bounds_min [-0.45, -0.75, 0.665]
  bounds_max: &bounds_max [0.10, 0.60, 1.2]
  sdf_voxel_size: 0.01
  vlm_camera: 0
  action_steps_per_iter: 5
  seed: *seed

  ik:
    descriptor: widowxai_descriptor.yaml
    # A real link, unlike Fetch's case: the URDF ships ee_gripper_link as a fixed child of link_6
    # at the same origin the generated eef_link occupies, so the reachability cost and the
    # controller agree on where the end-effector is instead of differing by a gripper length.
    eef_name: ee_gripper_link

env:
  video_cache_size: 2000
  og_sim:
    physics_frequency: 100
    rendering_frequency: 20
    action_frequency: 20

  scene:
    name: Rs_int
    type: InteractiveTraversableScene
    scene_model: Rs_int

  bounds_min: *bounds_min
  bounds_max: *bounds_max
  interpolate_pos_step_size: *interpolate_pos_step_size
  interpolate_rot_step_size: *interpolate_rot_step_size

  robot:
    robot_config:
      name: WidowXAI
      type: WidowXAI
      obs_modalities: [rgb, depth]
      action_modalities: continuous
      action_normalize: False
      # Fetch stands on the floor at [-0.8, 0, 0] and drives its torso up to the table. This arm
      # is bolted down, so it has to be mounted *on* the table, and where is not free:
      #
      #   table footprint   x in [-0.364, 0.631], y in [-1.216, 1.172]   (bmnubh, scale 2)
      #   pen_1             [-0.263, -0.176, 0.709]
      #   pencil_holder_1   [-0.300,  0.150, 0.751]
      #
      # Both objects sit within 10 cm of the table's -x edge, so there is no room to mount behind
      # them. Mounting at +x instead puts them 0.45-0.48 m away, comfortably inside the 0.7 m
      # rated reach and well outside the folded-in zone -- but it also puts them *behind* the
      # arm, because the arm's forward direction is its own +x. Rotating the waist to compensate
      # is not an option: joint_0's travel is +/-3.0543 rad = +/-175 deg, so a 180 deg turn is
      # just outside it. Hence the yaw below rather than a bigger joint_0 command.
      position: [0.15, 0.0, 0.69]
      orientation: [0.0, 0.0, 1.0, 0.0]   # (x,y,z,w) -- 180 deg yaw, so local +x faces world -x
      # z is the table top, taken from chapter 16.4's measured pen bottom (0.6993) and holder
      # floor (0.6913). Confirm against the AABB lines environment.py prints at startup.
      # Required by ReKep: get_sdf_voxels() reads _ag_obj_in_hand to keep the carried object out
      # of the scene SDF, and environment.py asserts the mode is assisted or sticky.
      grasping_mode: assisted

      controller_config:
        # No base controller: nothing to drive. No trunk or camera controller either -- this arm
        # has neither, which is also why environment.py asks for trunk DOFs conditionally.
        arm_0:
          name: InverseKinematicsController
          # Default mode; the command is (dx, dy, dz, dax, day, daz) in the robot frame, which is
          # exactly the six numbers _move_to_waypoint already builds for Fetch's OSC.
          mode: pose_delta_ori
        gripper_0:
          name: MultiFingerGripperController
          command_input_limits: [0.0, 1.0]
          mode: smooth

  # World-fixed cameras, unchanged from the Fetch config. cam_0 feeds the VLM, cam_1 only records
  # video. Neither is the wrist D405 -- ReKep does not use the robot's onboard camera.
  camera:
    # recorder
    1:
      name: cam_1
      position: [ 0.6137,  0.4764,  1.4565]
      orientation: [ 0.3212,  0.4682,  0.6788,  0.4656]
      resolution: 480

    # vlm camera
    0:
      name: cam_0
      position: [-0.1655,  0.0167,  1.3664]
      orientation: [ 0.0550,  0.0544,  0.7010,  0.7090]
      resolution: 480

path_solver:
  opt_pos_step_size: 0.20
  opt_rot_step_size: 0.78
  opt_interpolate_pos_step_size: 0.02
  opt_interpolate_rot_step_size: 0.10
  max_collision_points: 60
  sampling_maxfun: 5000
  bounds_min: *bounds_min
  bounds_max: *bounds_max
  constraint_tolerance: 0.0001
  minimizer_options:
    maxiter: 200

subgoal_solver:
  bounds_min: *bounds_min
  bounds_max: *bounds_max
  sampling_maxfun: 5000
  max_collision_points: 60
  constraint_tolerance: 0.0001
  minimizer_options:
    maxiter: 200

keypoint_proposer:
  num_candidates_per_mask: 5
  min_dist_bt_keypoints: 0.06
  max_mask_ratio: 0.5
  device: *device
  bounds_min: *bounds_min
  bounds_max: *bounds_max
  seed: *seed

constraint_generator:
  model: chatgpt-4o-latest
  temperature: 0.0
  max_tokens: 2048

visualizer:
  bounds_min: *bounds_min
  bounds_max: *bounds_max
